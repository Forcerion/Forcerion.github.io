<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio - Victor Murawjow</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">

    <div class="card header">
      <div>
        <span class="badge" id="year"></span>
        <h1 id="name"></h1>
        <p class="subtitle" id="subtitle"></p>
      </div>

      <div class="badges">
        <a class="badge" id="github" target="_blank">GitHub</a> |
        <span class="badge" id="email"></span> |
        <a class="badge" id="linkedin" target="_blank">LinkedIn</a>
      </div>
    </div>

    <div class="grid">
      <section class="card">
        <h2>À propos</h2>
        <p id="about"></p>
        <a class="btn" id="githubBtn" target="_blank">Voir mon GitHub →</a>
      </section>

      <section class="card">
        <h2>Compétences</h2>
        <ul id="skills"></ul>
      </section>

      <section class="card span-2">
        <h2>Projets</h2>
        <div id="projects"></div>
      </section>

      <section class="card span-2">
        <h2>Contact</h2>
        <p>Email : <span id="email2"></span></p>
        <p>GitHub : <a id="github2" target="_blank"></a></p>
        <p>LinkedIn : <a id="linkedin2" target="_blank"></a></p>
      </section>
    </div>

    <div class="footer" id="footer"></div>

  </div>

  <script src="app.js"></script>
</body>
</html>
